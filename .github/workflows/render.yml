name: 🎬 Remotion Universal Renderer

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  GITHUB LIMIT: a `workflow_dispatch` event may define AT MOST 25 inputs.
#     The previous revision defined 26, so GitHub rejected the whole file with
#     "Invalid workflow file — you may only define up to 25 `inputs`".
#
#     This revision defines exactly 25 inputs. Before adding a 26th, either:
#       1. pass the flag through `advanced_args` (any raw Remotion CLI flag), or
#       2. merge two related inputs (see `audio_track` / `codec_preset` below).
#
#     To use this as the main workflow, save it as .github/workflows/render.yml
#     (replacing the old 4K-locked pipeline, or keep both files side by side).
#
#     FRAME RANGES ARE NEVER GUESSED FROM SOURCE FILES. Unless you set `frames`
#     or `duration_seconds`, no --frames flag is passed at all, so Remotion
#     renders the composition's own full duration. When you do ask for a range,
#     the real duration is resolved with `npx remotion compositions` and the
#     range is clamped to it — so the error
#     'frame range 0-899 is not inbetween 0-719' cannot come back.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      # ── Composition ──────────────────────────────────────────────────────────
      composition_id:
        description: 'Single composition ID (auto-detected if blank)'
        required: false
        default: ''
      compositions_json:
        description: 'Bulk JSON: [{"id":"CompA"},{"id":"CompB"}]'
        required: false
        default: ''

      # ── Dimensions & Timing ──────────────────────────────────────────────────
      width:
        description: 'Width px — default auto from TSX'
        required: false
        default: ''
      height:
        description: 'Height px — default auto from TSX'
        required: false
        default: ''
      fps:
        description: 'FPS override — honored only by Remotion >= 4.0.424 (older versions ignore it). Also used to convert duration_seconds. Blank = composition fps'
        required: false
        default: ''
      duration_seconds:
        description: 'Partial render: first N seconds only (clamped to the composition length). Blank = render the whole composition (recommended)'
        required: false
        default: ''
      frames:
        description: 'Explicit frame range e.g. 0-299, or a single frame e.g. 150. Blank = render the whole composition (no --frames flag)'
        required: false
        default: ''
      scale:
        description: 'Output scale multiplier 0.1–16 (e.g. 2 doubles resolution). Default: 1'
        required: false
        default: '1'

      # ── Codec & Format ───────────────────────────────────────────────────────
      codec:
        description: 'h264 | h265 | vp8 | vp9 | av1 | prores | gif | mp3 | wav | aac'
        required: false
        default: 'h264'
      pixel_format:
        description: 'yuv420p | yuv422p | yuv444p | yuva420p (transparency). Default: yuv420p'
        required: false
        default: 'yuv420p'
      image_format:
        description: 'jpeg | png (png supports transparency). Default: jpeg'
        required: false
        default: 'jpeg'
      # 1 input instead of 2: becomes --x264-preset for h264, --prores-profile for prores
      codec_preset:
        description: 'h264: ultrafast…veryslow · prores: proxy|light|standard|hq|4444|4444-xq (blank = codec default)'
        required: false
        default: ''
      crf:
        description: 'CRF quality (h264:1-51, h265:0-51, vp8:4-63, vp9:0-63). Lower=better. Blank = preset default'
        required: false
        default: ''
      video_bitrate:
        description: 'Target bitrate e.g. 40M (overrides CRF if set). Adobe Stock: 40M'
        required: false
        default: ''
      audio_bitrate:
        description: 'Audio bitrate e.g. 320k. Default: codec default'
        required: false
        default: ''

      # ── Audio ────────────────────────────────────────────────────────────────
      # Replaces the old `muted` + `enforce_audio_track` pair (they were mutually
      # exclusive and used 2 of the 25 available input slots).
      audio_track:
        description: 'include = keep audio | muted = no audio track (Adobe Stock) | enforce = always add a (silent) audio track'
        required: false
        type: choice
        options:
          - include
          - muted
          - enforce
        default: 'include'

      # ── GIF options ──────────────────────────────────────────────────────────
      every_nth_frame:
        description: 'GIF only: render every Nth frame to reduce GIF FPS (e.g. 2 = half FPS)'
        required: false
        default: '1'
      gif_loops:
        description: 'GIF only: 0=no loop, 1=loop once, blank=infinite loop'
        required: false
        default: ''

      # ── Props / Data ─────────────────────────────────────────────────────────
      props:
        description: 'JSON props passed to composition e.g. {"title":"Hello","color":"#ff0000"}'
        required: false
        default: ''

      # ── Adobe Stock post-processing ──────────────────────────────────────────
      adobe_stock:
        description: 'true = re-encode to Adobe Stock spec (40 Mbps H264, no audio) after render'
        required: false
        default: 'false'

      # ── Output ───────────────────────────────────────────────────────────────
      concurrency:
        description: 'Render threads per job (default 2, max 4 on GitHub runners)'
        required: false
        default: '2'
      jpeg_quality:
        description: 'JPEG frame quality 0-100. Default: 80'
        required: false
        default: '80'
      timeout:
        description: 'Per-frame timeout ms. Default: 30000'
        required: false
        default: '30000'
      log_level:
        description: 'verbose | info | warn | error'
        required: false
        default: 'info'

      # ── Escape hatch (this is the 25th and last input) ───────────────────────
      advanced_args:
        description: 'Extra raw Remotion CLI flags appended as-is (e.g. --gl=angle --number-of-gif-loops=0)'
        required: false
        default: ''

# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. Build matrix from inputs ────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      ext:    ${{ steps.ext.outputs.ext }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        name: Build render matrix
        run: |
          BULK='${{ github.event.inputs.compositions_json }}'
          SINGLE='${{ github.event.inputs.composition_id }}'
          if [ -n "$BULK" ] && [ "$BULK" != "null" ]; then
            if ! echo "$BULK" | jq -e 'type == "array" and length > 0' > /dev/null; then
              echo "❌ compositions_json must be a non-empty JSON array: $BULK"
              exit 1
            fi
            echo "matrix={\"include\":$BULK}" >> "$GITHUB_OUTPUT"
          elif [ -n "$SINGLE" ]; then
            echo "matrix={\"include\":[{\"id\":\"$SINGLE\"}]}" >> "$GITHUB_OUTPUT"
          else
            # Auto-detect from composition.tsx (or src/compositions/comp*.tsx)
            ID=$(grep -hoP 'export\s+const\s+\K\w+(?=\s*:\s*React\.FC)' src/composition.tsx src/compositions/*.tsx 2>/dev/null | head -1 || true)
            ID=${ID:-Composition}
            echo "matrix={\"include\":[{\"id\":\"$ID\"}]}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - id: ext
        name: Determine output extension
        run: |
          CODEC="${{ github.event.inputs.codec || 'h264' }}"
          case "$CODEC" in
            h264|h265|av1) echo "ext=mp4"  >> "$GITHUB_OUTPUT" ;;
            vp8|vp9)       echo "ext=webm" >> "$GITHUB_OUTPUT" ;;
            prores)        echo "ext=mov"  >> "$GITHUB_OUTPUT" ;;
            gif)           echo "ext=gif"  >> "$GITHUB_OUTPUT" ;;
            mp3)           echo "ext=mp3"  >> "$GITHUB_OUTPUT" ;;
            wav)           echo "ext=wav"  >> "$GITHUB_OUTPUT" ;;
            aac)           echo "ext=aac"  >> "$GITHUB_OUTPUT" ;;
            *)             echo "ext=mp4"  >> "$GITHUB_OUTPUT" ;;
          esac

  # ── 2. Render — one parallel job per matrix entry ─────────────────────────
  render:
    needs: prepare
    name: Render ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm i

      - name: 🔧 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: 🔍 Validate TSX syntax
        run: |
          # Find the composition file(s)
          if [ -f "src/compositions/comp0.tsx" ]; then
            FILES=$(ls src/compositions/comp*.tsx 2>/dev/null || true)
          else
            FILES="src/composition.tsx"
          fi

          echo "Validating files: $FILES"
          for FILE in $FILES; do
            if [ -f "$FILE" ]; then
              # Basic brace balance check
              OPEN=$(grep -o '{' "$FILE" | wc -l || true)
              CLOSE=$(grep -o '}' "$FILE" | wc -l || true)
              echo "$FILE: { count=$OPEN } count=$CLOSE"
              if [ "$OPEN" != "$CLOSE" ]; then
                echo "⚠ Warning: Brace mismatch in $FILE (open=$OPEN close=$CLOSE)"
              fi
              # A renderable composition must export a React.FC component
              if ! grep -qP 'export\s+const\s+\w+\s*:\s*React\.FC' "$FILE"; then
                echo "❌ ERROR: No 'export const X: React.FC' found in $FILE"
                exit 1
              fi
              echo "✅ $FILE looks valid"
            fi
          done

      - name: 🎯 Resolve frame range
        id: range
        run: |
          FRAMES_IN="${{ github.event.inputs.frames }}"
          SECS="${{ github.event.inputs.duration_seconds }}"
          FPS_IN="${{ github.event.inputs.fps }}"
          PROPS='${{ github.event.inputs.props }}'
          ID="${{ matrix.id }}"

          # ── 1. Can the installed Remotion honor an fps override? ─────────────
          #      (the --fps flag only exists from Remotion 4.0.424 on)
          REMOTION_VERSION=""
          FPS_SUPPORTED="no"
          if [ -n "$FPS_IN" ]; then
            REMOTION_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/remotion/package.json','utf8')).version)" 2>/dev/null || true)
            FPS_SUPPORTED=$(node -e "const v='$REMOTION_VERSION'.split('.').map(Number);console.log(v[0]>4||(v[0]===4&&(v[1]>0||v[2]>=424))?'yes':'no')" 2>/dev/null || echo no)
            echo "Remotion ${REMOTION_VERSION:-unknown} — fps override supported: $FPS_SUPPORTED"
          fi
          echo "REMOTION_VERSION=$REMOTION_VERSION" >> "$GITHUB_ENV"
          echo "FPS_SUPPORTED=$FPS_SUPPORTED" >> "$GITHUB_ENV"

          # ── 2. Ask Remotion for the composition's real length ────────────────
          DURATION=""
          COMP_FPS=""
          RANGE=""
          if [ -n "$FRAMES_IN" ] || [ -n "$SECS" ]; then
            ENTRY=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('package.json','utf8'));console.log((j.remotion&&j.remotion.entryPoint)||'src/index.ts')}catch(e){console.log('src/index.ts')}")
            PROPS_ARG=""
            if [ -n "$PROPS" ] && [ "$PROPS" != "{}" ]; then
              echo "$PROPS" > /tmp/props.json
              PROPS_ARG="--props=/tmp/props.json"
            fi
            echo "Resolving: npx remotion compositions $ENTRY $PROPS_ARG"
            npx remotion compositions "$ENTRY" $PROPS_ARG > /tmp/compositions.txt 2>&1 || true
            LINE=$(awk -v id="$ID" '$1 == id {print; exit}' /tmp/compositions.txt || true)
            if [ -n "$LINE" ]; then
              COMP_FPS=$(echo "$LINE" | awk '{print $2}')
              DURATION=$(echo "$LINE" | awk '{print $4}')
              case "$DURATION" in
                ''|*[!0-9]*)
                  DURATION=""
                  ;;
              esac
              echo "Composition '$ID': fps=${COMP_FPS:-?} durationInFrames=${DURATION:-?}"
            fi
            if [ -z "$DURATION" ]; then
              echo "⚠ Could not resolve the length of '$ID' — the requested range is used as-is"
              echo "----- last 30 lines of the compositions output -----"
              tail -30 /tmp/compositions.txt || true
              echo "----------------------------------------------------"
            fi
          fi

          # ── 3. Build the range that was asked for ────────────────────────────
          if [ -n "$FRAMES_IN" ]; then
            RANGE="$FRAMES_IN"
          elif [ -n "$SECS" ]; then
            case "$SECS" in
              ''|*[!0-9]*)
                echo "❌ duration_seconds must be a whole number of seconds, got '$SECS'"
                exit 1
                ;;
            esac
            FPS_USE="$COMP_FPS"
            case "$FPS_USE" in
              ''|*[!0-9]*)
                FPS_USE="$FPS_IN"
                ;;
            esac
            case "$FPS_USE" in
              ''|*[!0-9]*)
                FPS_USE=30
                ;;
            esac
            RANGE="0-$(( SECS * FPS_USE - 1 ))"
            echo "Partial render: first ${SECS}s at ${FPS_USE} fps → frames $RANGE"
          fi

          # ── 4. Clamp it to the composition's real length ─────────────────────
          #      Without this, Remotion aborts with
          #      'frame range 0-899 is not inbetween 0-719'
          if [ -n "$RANGE" ] && [ -n "$DURATION" ]; then
            MAX=$(( DURATION - 1 ))
            if echo "$RANGE" | grep -qE '^[0-9]+-[0-9]+$'; then
              FIRST="${RANGE%%-*}"
              LAST="${RANGE##*-}"
              if [ "$LAST" -gt "$MAX" ]; then
                echo "⚠ Requested frames $RANGE exceed the composition ($DURATION frames) — clamping to $FIRST-$MAX"
                RANGE="$FIRST-$MAX"
              fi
            elif echo "$RANGE" | grep -qE '^[0-9]+$'; then
              if [ "$RANGE" -gt "$MAX" ]; then
                echo "⚠ Requested frame $RANGE exceeds the composition ($DURATION frames) — clamping to $MAX"
                RANGE="$MAX"
              fi
            else
              echo "ℹ '$RANGE' is not a plain range — passing it to Remotion unchanged"
            fi
          fi

          echo "frames=$RANGE" >> "$GITHUB_OUTPUT"
          if [ -n "$RANGE" ]; then
            echo "Rendering frames: $RANGE"
          else
            echo "Rendering the full composition (no --frames flag)"
          fi

      - name: 🎬 Render ${{ matrix.id }}
        run: |
          mkdir -p out

          CODEC="${{ github.event.inputs.codec || 'h264' }}"
          EXT="${{ needs.prepare.outputs.ext }}"
          OUTPUT="out/${{ matrix.id }}.$EXT"
          FRAMES="${{ steps.range.outputs.frames }}"
          SCALE="${{ github.event.inputs.scale || '1' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '2' }}"
          AUDIO_MODE="${{ github.event.inputs.audio_track || 'include' }}"
          IMAGE_FORMAT="${{ github.event.inputs.image_format || 'jpeg' }}"
          JPEG_QUALITY="${{ github.event.inputs.jpeg_quality || '80' }}"
          TIMEOUT="${{ github.event.inputs.timeout || '30000' }}"
          LOG="${{ github.event.inputs.log_level || 'info' }}"
          PRESET="${{ github.event.inputs.codec_preset }}"
          PIXEL_FMT="${{ github.event.inputs.pixel_format || 'yuv420p' }}"
          CRF="${{ github.event.inputs.crf }}"
          VIDEO_BITRATE="${{ github.event.inputs.video_bitrate }}"
          AUDIO_BITRATE="${{ github.event.inputs.audio_bitrate }}"
          EVERY_NTH="${{ github.event.inputs.every_nth_frame || '1' }}"
          GIF_LOOPS="${{ github.event.inputs.gif_loops }}"
          PROPS='${{ github.event.inputs.props }}'
          ADOBE="${{ github.event.inputs.adobe_stock || 'false' }}"
          ADVANCED_ARGS="${{ github.event.inputs.advanced_args }}"
          W="${{ github.event.inputs.width }}"
          H="${{ github.event.inputs.height }}"
          FPS="${{ github.event.inputs.fps }}"

          # Expose the Adobe flag to the later "Inspect output" step
          echo "ADOBE_STOCK=$ADOBE" >> "$GITHUB_ENV"

          # Build the remotion render command dynamically
          CMD="npx remotion render \"${{ matrix.id }}\" \"$OUTPUT\""
          CMD="$CMD --codec=$CODEC"
          CMD="$CMD --pixel-format=$PIXEL_FMT"
          CMD="$CMD --image-format=$IMAGE_FORMAT"
          CMD="$CMD --jpeg-quality=$JPEG_QUALITY"
          CMD="$CMD --concurrency=$CONCURRENCY"
          CMD="$CMD --timeout=$TIMEOUT"
          CMD="$CMD --log=$LOG"
          CMD="$CMD --scale=$SCALE"

          # Only pass dimensions / timing when explicitly provided
          [ -n "$W" ] && CMD="$CMD --width=$W"
          [ -n "$H" ] && CMD="$CMD --height=$H"

          if [ -n "$FPS" ]; then
            if [ "$FPS_SUPPORTED" = "yes" ]; then
              CMD="$CMD --fps=$FPS"
            else
              echo "ℹ fps input ignored — the --fps override needs Remotion >= 4.0.424 (installed: ${REMOTION_VERSION:-unknown}); the composition fps is used instead"
            fi
          fi

          # No --frames flag at all => Remotion renders the composition's full duration
          [ -n "$FRAMES" ] && CMD="$CMD --frames=$FRAMES"

          # CRF or video bitrate (mutually exclusive — bitrate wins if both are set)
          if [ -n "$VIDEO_BITRATE" ]; then
            CMD="$CMD --video-bitrate=$VIDEO_BITRATE"
          elif [ -n "$CRF" ]; then
            CMD="$CMD --crf=$CRF"
          fi

          # Audio bitrate
          [ -n "$AUDIO_BITRATE" ] && CMD="$CMD --audio-bitrate=$AUDIO_BITRATE"

          # Audio track handling (replaces the old muted / enforce_audio_track pair)
          if [ "$AUDIO_MODE" = "muted" ]; then
            CMD="$CMD --muted"
          elif [ "$AUDIO_MODE" = "enforce" ]; then
            CMD="$CMD --enforce-audio-track"
          fi

          # Codec preset (replaces the old prores_profile / x264_preset pair)
          if [ -n "$PRESET" ]; then
            if [ "$CODEC" = "prores" ]; then
              CMD="$CMD --prores-profile=$PRESET"
            elif [ "$CODEC" = "h264" ]; then
              CMD="$CMD --x264-preset=$PRESET"
            fi
          fi

          # GIF-specific options
          if [ "$CODEC" = "gif" ]; then
            [ "$EVERY_NTH" != "1" ] && CMD="$CMD --every-nth-frame=$EVERY_NTH"
            [ -n "$GIF_LOOPS" ] && CMD="$CMD --number-of-gif-loops=$GIF_LOOPS"
          fi

          # Props JSON
          if [ -n "$PROPS" ] && [ "$PROPS" != "{}" ]; then
            echo "$PROPS" > /tmp/props.json
            CMD="$CMD --props=/tmp/props.json"
          fi

          # Escape hatch: any extra raw Remotion CLI flags
          [ -n "$ADVANCED_ARGS" ] && CMD="$CMD $ADVANCED_ARGS"

          echo "=== Render Command ==="
          echo "$CMD"
          echo "====================="
          eval $CMD

          # ── Adobe Stock post-processing ─────────────────────────────────
          if [ "$ADOBE" = "true" ] && [ "$CODEC" = "h264" ]; then
            echo "=== Adobe Stock re-encode ==="
            mv "$OUTPUT" "out/${{ matrix.id }}_raw.mp4"
            ffmpeg -y \
              -i "out/${{ matrix.id }}_raw.mp4" \
              -c:v libx264 \
              -b:v 40M \
              -minrate 35M \
              -maxrate 50M \
              -bufsize 100M \
              -profile:v high \
              -level:v 5.2 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -an \
              "$OUTPUT"
            rm "out/${{ matrix.id }}_raw.mp4"
            echo "Adobe Stock re-encode done"
          fi

          echo "=== Output File ==="
          ls -lh "$OUTPUT"

      - name: 🔬 Inspect output
        run: |
          EXT="${{ needs.prepare.outputs.ext }}"
          OUTPUT="out/${{ matrix.id }}.$EXT"
          CODEC="${{ github.event.inputs.codec || 'h264' }}"

          if [ "$CODEC" = "gif" ] || [ "$CODEC" = "mp3" ] || [ "$CODEC" = "wav" ] || [ "$CODEC" = "aac" ]; then
            echo "Output: $(ls -lh "$OUTPUT")"
          else
            ffprobe -v quiet -print_format json -show_format -show_streams "$OUTPUT" > /tmp/probe.json 2>&1 || true
            python3 - << 'PYEOF'
          import json, os, sys
          ADOBE = os.environ.get("ADOBE_STOCK", "false")
          try:
            d = json.load(open('/tmp/probe.json'))
            fmt = d.get('format', {})
            streams = d.get('streams', [])
            vid = next((s for s in streams if s.get('codec_type') == 'video'), None)
            aud = next((s for s in streams if s.get('codec_type') == 'audio'), None)
            size_mb  = int(fmt.get('size', 0)) / 1024 / 1024
            duration = float(fmt.get('duration', 0))
            bitrate  = int(fmt.get('bit_rate', 0)) / 1_000_000
            print()
            print("=" * 50)
            print(f"File:       {fmt.get('filename','')}")
            print(f"Size:       {size_mb:.1f} MB")
            print(f"Duration:   {duration:.2f}s")
            print(f"Bitrate:    {bitrate:.2f} Mbps")
            if vid:
              print(f"Resolution: {vid.get('width')}x{vid.get('height')}")
              print(f"FPS:        {vid.get('r_frame_rate')}")
              print(f"Codec:      {vid.get('codec_name')} {vid.get('profile','')}")
            print(f"Audio:      {'NONE' if aud is None else aud.get('codec_name','unknown') + ' (present)'}")
            print("=" * 50)
            errors = []
            if ADOBE == "true":
              if bitrate < 20:
                errors.append(f"Bitrate too low: {bitrate:.1f} Mbps (need >= 20 Mbps for Adobe Stock)")
              if aud is not None:
                errors.append("Audio stream present — must be muted for Adobe Stock")
            if errors:
              print()
              for e in errors:
                print(f"FAIL: {e}")
              sys.exit(1)
            else:
              print("All checks passed!")
          except Exception as e:
            print(f"Could not parse probe: {e}")
          PYEOF
          fi

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.id }}_${{ github.event.inputs.codec || 'h264' }}"
          path: "out/${{ matrix.id }}.${{ needs.prepare.outputs.ext }}"
          if-no-files-found: error
          retention-days: 2
