🎬 Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Single composition ID'
        required: false
        default: ''
      compositions_json:
        description: 'Bulk JSON: [{"id":"CompA"},{"id":"CompB"}]'
        required: false
        default: ''
      width:
        description: 'Width in px (default 3840)'
        required: false
        default: '3840'
      height:
        description: 'Height in px (default 2160)'
        required: false
        default: '2160'
      fps:
        description: 'Frames per second (default 60)'
        required: false
        default: '60'
      duration_seconds:
        description: 'Duration in seconds (default 15)'
        required: false
        default: '15'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix:     ${{ steps.set.outputs.matrix }}
      last_frame: ${{ steps.calc.outputs.last_frame }}
    steps:
      - id: set
        run: |
          BULK='${{ github.event.inputs.compositions_json }}'
          SINGLE='${{ github.event.inputs.composition_id }}'
          if [ -n "$BULK" ] && [ "$BULK" != "null" ] && [ "$BULK" != "" ]; then
            echo "matrix={\"include\":$(echo $BULK)}" >> $GITHUB_OUTPUT
          elif [ -n "$SINGLE" ] && [ "$SINGLE" != "" ]; then
            echo "matrix={\"include\":[{\"id\":\"$SINGLE\",\"file\":\"composition\"}]}" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"include\":[{\"id\":\"CybersecurityNetworkMap\",\"file\":\"composition\"}]}" >> $GITHUB_OUTPUT
          fi

      - id: calc
        run: |
          FPS=${{ github.event.inputs.fps || 60 }}
          SECS=${{ github.event.inputs.duration_seconds || 15 }}
          LAST=$(( FPS * SECS - 1 ))
          echo "last_frame=$LAST" >> $GITHUB_OUTPUT

  render:
    needs: prepare
    name: Render ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-node@main
        with:
          node-version: '20'

      - run: npm i

      - name: 🔧 Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: 🎬 Render ${{ matrix.id }}
        run: |
          mkdir -p out

          # Step 1 — Remotion render at near-lossless quality, no audio
          npx remotion render \
            "${{ matrix.id }}" \
            "out/${{ matrix.id }}_raw.mp4" \
            --width=${{ github.event.inputs.width || 3840 }} \
            --height=${{ github.event.inputs.height || 2160 }} \
            --fps=${{ github.event.inputs.fps || 60 }} \
            --frames=0-${{ needs.prepare.outputs.last_frame }} \
            --codec=h264 \
            --crf=1 \
            --pixel-format=yuv420p \
            --muted \
            --concurrency=2

          # Step 2 — Re-encode to Adobe Stock spec: 40 Mbps target, 35 Mbps minimum, no audio
          ffmpeg -y \
            -i "out/${{ matrix.id }}_raw.mp4" \
            -c:v libx264 \
            -b:v 40M \
            -minrate 35M \
            -maxrate 50M \
            -bufsize 100M \
            -profile:v high \
            -level:v 5.2 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -an \
            "out/${{ matrix.id }}.mp4"

          # Remove intermediate raw file
          rm "out/${{ matrix.id }}_raw.mp4"

          # Step 3 — Verify with ffprobe
          echo "=== Output file info ==="
          ffprobe -v quiet -print_format json -show_format -show_streams \
            "out/${{ matrix.id }}.mp4" > /tmp/probe.json

          python3 - << 'PYEOF'
          import json, sys
          d = json.load(open('/tmp/probe.json'))
          fmt     = d['format']
          streams = d['streams']
          vid = next((s for s in streams if s['codec_type'] == 'video'), None)
          aud = next((s for s in streams if s['codec_type'] == 'audio'), None)

          size_mb  = int(fmt['size']) / 1024 / 1024
          duration = float(fmt['duration'])
          bitrate  = int(fmt.get('bit_rate', 0)) / 1_000_000

          print(f"File:       {fmt['filename']}")
          print(f"Size:       {size_mb:.1f} MB")
          print(f"Duration:   {duration:.2f}s")
          print(f"Bitrate:    {bitrate:.2f} Mbps")
          print(f"Resolution: {vid['width']}x{vid['height']}")
          print(f"FPS:        {vid['r_frame_rate']}")
          print(f"Codec:      {vid['codec_name']} {vid['profile']}")
          print(f"Audio:      {'NONE ✅' if aud is None else 'PRESENT ❌ ' + aud['codec_name']}")

          errors = []
          if bitrate < 20:
              errors.append(f"Bitrate too low: {bitrate:.1f} Mbps (need >= 20 Mbps)")
          if aud is not None:
              errors.append("Audio stream present — must be muted for Adobe Stock")

          if errors:
              print()
              for e in errors:
                  print(f"❌ FAIL: {e}")
              sys.exit(1)
          else:
              print()
              print("✅ All Adobe Stock quality checks passed!")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.id }}_4K_60fps_AdobeStock"
          path: "out/${{ matrix.id }}.mp4"
          retention-days: 2
EOF
