name: 🎬 Render Remotion Video

# ---------------------------------------------------------------------------
# YAML RULE THAT BROKE THIS FILE (the "error in your yaml syntax on line 92"):
#
# A `run: |` block is a YAML *literal block scalar*. Every non-empty line of the
# script must be indented MORE than the key that introduces it. `run:` sits at
# column 9, so all script lines must start with >= 9 spaces (this file uses 10).
#
# A line indented less than that silently ENDS the block scalar, and YAML then
# tries to parse `');` as a normal mapping line -> "could not find expected ':'".
#
# The old "Validate composition syntax" step did exactly that: its inline
# node -e block contained a real line break where the two characters  \  n
# were meant, i.e.
#
#     line 91:  ... content.split('      <-- string literal left open
#     line 92:  ');                        <-- continued at COLUMN 1 (0 spaces!)
#
# which un-indented everything after it and killed the block scalar at line 92.
#
# Rule of thumb: never put a multi-line JS/Python string literal inside a
# `run:` block; use a single-line string (or a script file committed to the repo).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Single composition ID'
        required: false
        default: ''
      compositions_json:
        description: 'Bulk JSON: [{"id":"CompA"},{"id":"CompB"}]'
        required: false
        default: ''
      width:
        description: 'Width in px (default 3840)'
        required: false
        default: '3840'
      height:
        description: 'Height in px (default 2160)'
        required: false
        default: '2160'
      fps:
        description: 'Frames per second (default 60)'
        required: false
        default: '60'
      duration_seconds:
        description: 'Duration in seconds (default 15)'
        required: false
        default: '15'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix:     ${{ steps.set.outputs.matrix }}
      last_frame: ${{ steps.calc.outputs.last_frame }}
    steps:
      - id: set
        run: |
          BULK='${{ github.event.inputs.compositions_json }}'
          SINGLE='${{ github.event.inputs.composition_id }}'
          if [ -n "$BULK" ] && [ "$BULK" != "null" ]; then
            echo "matrix={\"include\":$BULK}" >> "$GITHUB_OUTPUT"
          elif [ -n "$SINGLE" ]; then
            echo "matrix={\"include\":[{\"id\":\"$SINGLE\"}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[{\"id\":\"CybersecurityNetworkMap\"}]}" >> "$GITHUB_OUTPUT"
          fi

      - id: calc
        run: |
          FPS=${{ github.event.inputs.fps || 60 }}
          SECS=${{ github.event.inputs.duration_seconds || 15 }}
          echo "last_frame=$(( FPS * SECS - 1 ))" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    name: Render ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-node@main
        with:
          node-version: '20'

      - run: npm i

      - name: 🔧 Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: 🎬 Render ${{ matrix.id }}
        run: |
          mkdir -p out

          # Step 1 - Remotion render at near-lossless quality, no audio
          npx remotion render \
            "${{ matrix.id }}" \
            "out/${{ matrix.id }}_raw.mp4" \
            --width=${{ github.event.inputs.width || 3840 }} \
            --height=${{ github.event.inputs.height || 2160 }} \
            --fps=${{ github.event.inputs.fps || 60 }} \
            --frames=0-${{ needs.prepare.outputs.last_frame }} \
            --codec=h264 \
            --crf=1 \
            --pixel-format=yuv420p \
            --muted \
            --concurrency=2

          # Step 2 - Re-encode to Adobe Stock spec: 40 Mbps target, 35 Mbps min, no audio
          ffmpeg -y \
            -i "out/${{ matrix.id }}_raw.mp4" \
            -c:v libx264 \
            -b:v 40M \
            -minrate 35M \
            -maxrate 50M \
            -bufsize 100M \
            -profile:v high \
            -level:v 5.2 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -an \
            "out/${{ matrix.id }}.mp4"

          rm -f "out/${{ matrix.id }}_raw.mp4"

      - name: ✅ Verify Adobe Stock spec
        run: |
          FILE="out/${{ matrix.id }}.mp4"
          EXPECTED_WIDTH="${{ github.event.inputs.width || 3840 }}"

          # probe() prints exactly one bare value. `-of default=nokey=1:noprint_wrappers=1`
          # avoids the CSV writer, and the extra `tr -d ',\r '` also tolerates the
          # trailing field separator some ffprobe builds append (the runners printed
          # "3840," for csv=p=0, which made the width check fail).
          probe() {
            ffprobe -v error -of default=nokey=1:noprint_wrappers=1 "$@" "$FILE" | tr -d ',\r ' | head -n 1
          }

          WIDTH=$(probe -select_streams v:0 -show_entries stream=width)
          HEIGHT=$(probe -select_streams v:0 -show_entries stream=height)
          FPS=$(probe -select_streams v:0 -show_entries stream=r_frame_rate)
          CODEC=$(probe -select_streams v:0 -show_entries stream=codec_name)
          DURATION=$(probe -show_entries format=duration)
          BITRATE=$(probe -show_entries format=bit_rate)
          AUDIO=$(probe -select_streams a -show_entries stream=codec_name)
          SIZE=$(stat -c %s "$FILE")

          MBPS=$(awk -v b="$BITRATE" 'BEGIN { printf "%.2f", b / 1000000 }')
          MB=$(awk -v s="$SIZE" 'BEGIN { printf "%.1f", s / 1048576 }')

          echo "=== Output file info ==="
          echo "File:       $FILE"
          echo "Size:       $MB MB"
          echo "Duration:   $DURATION s"
          echo "Bitrate:    $MBPS Mbps"
          echo "Resolution: ${WIDTH}x${HEIGHT} (expected width: $EXPECTED_WIDTH)"
          echo "FPS:        $FPS"
          echo "Codec:      $CODEC"
          echo "Audio:      ${AUDIO:-NONE}"

          FAILED=0

          if ! awk -v b="$BITRATE" 'BEGIN { exit !(b / 1000000 >= 20) }'; then
            echo "❌ FAIL: Bitrate too low: $MBPS Mbps (need >= 20 Mbps)"
            FAILED=1
          fi

          if [ -n "$AUDIO" ]; then
            echo "❌ FAIL: Audio stream present ($AUDIO) - must be muted for Adobe Stock"
            FAILED=1
          fi

          if [ -z "$WIDTH" ]; then
            echo "❌ FAIL: Could not read the video width from $FILE"
            FAILED=1
          elif [ "$WIDTH" != "$EXPECTED_WIDTH" ]; then
            echo "❌ FAIL: Wrong width: $WIDTH (expected $EXPECTED_WIDTH)"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "✅ All Adobe Stock quality checks passed!"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.id }}_4K_60fps_AdobeStock"
          path: "out/${{ matrix.id }}.mp4"
          retention-days: 2
