name: 🎬 Render Remotion Video

on:
  push:
    paths:
      - 'src/composition.tsx'
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Composition ID to render'
        required: false
        default: 'CybersecurityNetworkMap'

jobs:
  render:
    name: Render 4K 60fps 15s Video
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-node@main

      - run: npm i

      - name: 🎬 Render video
        run: |
          mkdir -p out
          npx remotion render \
            "${{ github.event.inputs.composition_id || 'CybersecurityNetworkMap' }}" \
            out/video.mp4 \
            --width=3840 \
            --height=2160 \
            --fps=60 \
            --frames=0-899 \
            --codec=h264 \
            --crf=18 \
            --pixel-format=yuv420p \
            --concurrency=2

      - uses: actions/upload-artifact@v4
        with:
          name: CybersecurityNetworkMap_4K
          path: out/video.mp4
          retention-days: 90
